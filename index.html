<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeSpace — NYC Commercial Properties</title>
  <style>
    :root { --primary: #1e3a8a; }
    * { box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      margin: 0; 
      background: #f8f9fa; 
      line-height: 1.6;
    }
    header { background: var(--primary); color: white; padding: 2rem 1rem; text-align: center; }
    nav { background: #112e6e; padding: 1rem; }
    nav ul { margin: 0; padding: 0; display: flex; justify-content: center; gap: 2rem; list-style: none; }
    nav a { color: white; text-decoration: none; }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: center;
    }
    
    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      min-width: 220px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-8px); }
    
    .card img { width: 100%; height: 220px; object-fit: cover; }
    
    .card-body { padding: 1.25rem; }
    .price { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin: 0.5rem 0; }

    footer {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 3rem 1rem;
      margin-top: 4rem;
    }

    @media (max-width: 600px) {
      .controls { flex-direction: column; align-items: stretch; }
      input, select { min-width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>PrimeSpace</h1>
    <p>Premium Commercial Properties in New York City</p>
  </header>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Properties</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search properties (e.g. laptop, furniture...)" />

      <select id="sortFilter">
        <option value="default">Sort by...</option>
        <option value="az">A - Z</option>
        <option value="za">Z - A</option>
        <option value="price-high">Price: High to Low</option>
        <option value="price-low">Price: Low to High</option>
      </select>
    </div>

    <h2 id="count">Loading properties...</h2>
    <div class="card-grid" id="propertyGrid"></div>
  </main>

  <footer>
    <p>&copy; 2026 PrimeSpace • Front-End Bootcamp Final Project</p>
    <p>Data from FakeStore API</p>
  </footer>

  <script>
    const grid = document.getElementById('propertyGrid');
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('sortFilter');
    const countEl = document.getElementById('count');
    let properties = [];

    async function loadProperties() {
      try {
        const res = await fetch('https://fakestoreapi.com/products');
        properties = await res.json();

        properties.forEach((item, i) => {
          item.listedDate = `2025-${String(12 - (i % 6)).padStart(2, '0')}-15`;
        });

        renderProperties(properties);
      } catch (err) {
        grid.innerHTML = `<p style="color:red; text-align:center;">Failed to load data.</p>`;
      }
    }

    function renderProperties(data) {
      grid.innerHTML = '';
      const limitedData = data.slice(0, 6); // Limit to 6 items as requested

      limitedData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}">
          <div class="card-body">
            <h3>${item.title}</h3>
            <p class="price">$${(item.price * 12000).toLocaleString()}</p>
            <small>Listed: ${item.listedDate}</small>
          </div>
        `;
        grid.appendChild(card);
      });

      countEl.textContent = `${limitedData.length} Properties Shown (Limited to 6)`;
    }

    // Search + Filter Combined
    function filterAndSort() {
      let filtered = properties.filter(item => 
        item.title.toLowerCase().includes(searchInput.value.toLowerCase())
      );

      // Apply sorting
      switch(filterSelect.value) {
        case 'az': filtered.sort((a,b) => a.title.localeCompare(b.title)); break;
        case 'za': filtered.sort((a,b) => b.title.localeCompare(a.title)); break;
        case 'price-high': filtered.sort((a,b) => b.price - a.price); break;
        case 'price-low': filtered.sort((a,b) => a.price - b.price); break;
      }

      renderProperties(filtered);
    }

    searchInput.addEventListener('input', filterAndSort);
    filterSelect.addEventListener('change', filterAndSort);

    // Load data
    loadProperties();
  </script>
</body>
</html>
