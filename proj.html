<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeSpace — NYC Commercial Properties</title>
  <style>
    :root { --primary: #1e3a8a; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f8f9fa; }
    header { background: var(--primary); color: white; text-align: center; padding: 3rem 1rem; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-8px); }
    
    .card img { width: 100%; height: 220px; object-fit: cover; }
    
    .card-body { padding: 1.25rem; }
    .price { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin: 0.5rem 0; }
    
    footer {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 2.5rem 1rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>PrimeSpace</h1>
    <p>Premium Commercial Properties in New York City</p>
  </header>

  <div class="container">
    <div class="controls">
      <h2 id="count">Loading properties...</h2>
      
      <select id="sortFilter">
        <option value="default">Sort by...</option>
        <option value="az">A - Z</option>
        <option value="za">Z - A</option>
        <option value="price-high">Price: High to Low</option>
        <option value="price-low">Price: Low to High</option>
      </select>
    </div>

    <div class="card-grid" id="propertyGrid"></div>
  </div>

  <footer>
    <p>&copy; 2026 PrimeSpace • Portfolio Project for Front-End Bootcamp</p>
    <p>Data provided by FakeStore API</p>
  </footer>

  <script>
    const grid = document.getElementById('propertyGrid');
    const filterSelect = document.getElementById('sortFilter');
    const countEl = document.getElementById('count');
    let properties = [];

    async function loadProperties() {
      try {
        const response = await fetch('https://fakestoreapi.com/products');
        properties = await response.json();

        // Add fake listing dates for sorting
        properties.forEach((item, index) => {
          const month = String(12 - (index % 6)).padStart(2, '0');
          item.listedDate = `2025-${month}-15`;
        });

        countEl.textContent = `${properties.length} Properties Found`;
        renderProperties(properties);
      } catch (error) {
        grid.innerHTML = `<p style="color: red; text-align: center;">Failed to load data. Please refresh.</p>`;
      }
    }

    function renderProperties(data) {
      grid.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}">
          <div class="card-body">
            <h3>${item.title}</h3>
            <p class="price">$${(item.price * 12000).toLocaleString()}</p>
            <small>Listed: ${item.listedDate}</small>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Sorting
    filterSelect.addEventListener('change', () => {
      let sortedData = [...properties];

      switch(filterSelect.value) {
        case 'az':
          sortedData.sort((a, b) => a.title.localeCompare(b.title));
          break;
        case 'za':
          sortedData.sort((a, b) => b.title.localeCompare(a.title));
          break;
        case 'price-high':
          sortedData.sort((a, b) => b.price - a.price);
          break;
        case 'price-low':
          sortedData.sort((a, b) => a.price - b.price);
          break;
      }
      renderProperties(sortedData);
    });

    // Start the app
    loadProperties();
  </script>
</body>
</html>
